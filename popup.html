<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <header>
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
          <circle cx="9" cy="9" r="4"></circle>
          <path d="M12 12l7 7M16 16l2-2M19 19l2-2"></path>
        </svg>
      </span>
      <span class="title">凭证导出</span>
      <span class="ver" id="ver"></span>
      <span class="site-chip" id="site"></span>
      <button class="icon-btn" id="btn-settings" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <div class="body">
      <div class="field">
        <select id="platform"></select>
      </div>

      <div class="row" style="margin-top:8px">
        <button class="btn primary" id="btn-main"></button>
      </div>

      <div class="row">
        <button class="btn" id="btn-scan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-3.5-3.5"></path>
          </svg>
          重扫
        </button>
        <button class="btn" id="btn-import">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 3v12M8 11l4 4 4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"></path>
          </svg>
          导入
        </button>
        <button class="btn" id="btn-manual">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          手动加
        </button>
      </div>

      <div class="status" id="status">正在加载…</div>

      <div class="stats" id="stats" style="display:none"></div>

      <!-- 搜索 + 排序 -->
      <div class="toolbar">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-3.5-3.5"></path>
          </svg>
          <input id="search" type="text" placeholder="搜索昵称 / UID / 域名…" autocomplete="off" spellcheck="false">
        </div>
        <button class="btn tiny" id="btn-sort" title="切换排序">按到期</button>
        <button class="btn tiny" id="btn-bulk" title="批量选择">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
          </svg>
        </button>
      </div>

      <!-- 列表头 -->
      <div class="list-head">
        <span class="list-title" id="list-title">凭证池</span>
        <select id="filter-status" class="mini-select" title="按状态筛选">
          <option value="all">全部</option>
          <option value="expired">已过期</option>
          <option value="soon">即将到期</option>
          <option value="disabled">已停用</option>
        </select>
        <span class="segmented">
          <button class="seg active" data-tab="pool">
            池子 <span class="count" id="pool-count">0</span>
          </button>
          <button class="seg" data-tab="captured">
            扫到 <span class="count" id="cap-count">0</span>
          </button>
        </span>
      </div>

      <div class="list" id="list"></div>

      <!-- 批量操作条 -->
      <div class="bulkbar" id="bulkbar" hidden>
        <span class="bulk-count" id="bulk-count">点选凭证</span>
        <button class="btn tiny" id="bulk-all">全选</button>
        <button class="btn tiny" id="bulk-copy">复制</button>
        <button class="btn tiny" id="bulk-refresh">续期</button>
        <button class="btn tiny" id="bulk-toggle">停用</button>
        <button class="btn tiny danger" id="bulk-remove">移除</button>
      </div>

      <div class="foot">
        <button class="btn" id="btn-copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="9" y="9" width="11" height="11" rx="2"></rect>
            <path d="M5 15V5a2 2 0 012-2h10"></path>
          </svg>
          复制
        </button>
        <button class="btn" id="btn-download">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 3v12M8 11l4 4 4-4M4 19h16"></path>
          </svg>
          下载
        </button>
        <button class="btn" id="btn-refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6"></path>
          </svg>
          续期
        </button>
        <button class="btn" id="btn-clear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12"></path>
          </svg>
          清空
        </button>
      </div>

      <div class="foot-extra">
        <label class="check-inline">
          <input type="checkbox" id="opt-only-valid">
          <span>跳过过期</span>
        </label>
        <select id="export-format" class="mini-select" title="导出格式">
          <option value="auto">自动</option>
          <option value="workbuddy">WB</option>
          <option value="generic">通用</option>
          <option value="raw">纯 token</option>
          <option value="bearer">Bearer</option>
          <option value="curl">curl</option>
          <option value="env">.env</option>
          <option value="postman">Postman</option>
        </select>
        <button class="link-btn" id="btn-check-all">体检</button>
        <button class="link-btn" id="btn-site-toggle">本站已开</button>
        <button class="link-btn" id="btn-backup">备份</button>
        <button class="link-btn" id="btn-restore">恢复</button>
        <button class="link-btn" id="btn-clean-expired">清过期</button>
        <button class="link-btn" id="btn-clean-garbage" title="清掉已过期的和不像 token 的脏数据">清无效</button>
      </div>

      <div class="hint" id="hint"></div>
    </div>
  </div>

  <!-- 详情面板 -->
  <div class="sheet" id="detail" hidden>
    <div class="sheet-box">
      <div class="sheet-head">
        <span class="sheet-title" id="detail-title">凭证详情</span>
        <button class="icon-btn" id="detail-close" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>
      <div class="sheet-body" id="detail-body"></div>
      <div class="sheet-foot">
        <button class="btn" id="detail-copy-token">复制 token</button>
        <button class="btn" id="detail-refresh-one">续期</button>
        <button class="btn" id="detail-note">备注</button>
        <button class="btn" id="detail-toggle">停用</button>
        <button class="btn danger" id="detail-remove">移除</button>
      </div>
    </div>
  </div>

  <!-- 导入弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <h3 id="modal-title">粘贴导入</h3>
      <p id="modal-desc">支持完整导出数组、单个对象、或只贴 token。</p>
      <textarea id="modal-input"></textarea>
      <div class="modal-foot">
        <button class="btn" id="modal-cancel">取消</button>
        <button class="btn primary" id="modal-ok">确定</button>
      </div>
    </div>
  </div>

  <input type="file" id="restore-file" accept=".json" hidden>
  <script type="module" src="popup.js"></script>
</body>
</html>
